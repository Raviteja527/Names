<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Name App</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="welcome" (click)="goToCreate()">

    <div class="welcome-card">

      <div class="app-icon">
        N
      </div>

      <h1>Welcome to Name App</h1>

      <p>
        Manage your names easily
      </p>

      <ion-button>
        Get Started
      </ion-button>

      <span class="continue-text">
        Click anywhere to continue
      </span>

    </div>

  </div>

</ion-content>
