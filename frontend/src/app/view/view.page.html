

  <div class="page">

    <h1 class="page-title">View Names</h1>

    <p>Total names: {{ names.length }}</p>

    <ion-list>

      @for (item of names; track item.id) {

        <ion-item>

          <ion-label>
            <h2>{{ item.name }}</h2>
            <p>ID: {{ item.id }}</p>
          </ion-label>

        </ion-item>

      }

    </ion-list>

  </div>
